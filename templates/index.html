<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detector de Fraude</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
            width: 320px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
            transform: scale(1.02);
        }

        .subtitle {
            font-size: 12px;
            color: #777;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Detector de Fraude</h2>
    <div class="subtitle">Análise inteligente de transações</div>

    <form action="/predict" method="post">

        <input name="v1" placeholder="Variável 1"><br>
        <input name="v2" placeholder="Variável 2"><br>
        <input name="v3" placeholder="Variável 3"><br>
        <input name="amount" placeholder="Valor da transação"><br>

        <button type="submit">Analisar Transação</button>

    </form>

</div>

</body>
</html>
